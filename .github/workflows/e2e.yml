name: E2E

# Playwright against a production build with the same settings as the local gate (README, .claude/CLAUDE.md). A plain build, not the
# Worker build: faster, and ci.yml's worker job covers Cloudflare. The run is in memory with no D1 or Cloudflare account
# (E2E_FAKE_BACKENDS and a stub dashboard, both started by playwright.config.ts), so it needs no secrets.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The image has the browsers built in. Keep the tag in step with @playwright/test in package-lock.json (ci.yml checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      APP_ENV: production
      SIMULATE_INTEGRATIONS: "on" # the registration lookup specs use the simulated lookup, and this job builds as production
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000BB # Cloudflare's always-pass test key; specs stub the script anyway
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run stock:redate # sold cars leave the 30 day window; keep the demo dates fresh
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
